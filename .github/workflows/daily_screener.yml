name: Daily Taiwan Stock Screener

on:
  schedule:
    # A5-N T-1 premarket pool: 08:40 Asia/Taipei = 00:40 UTC.
    - cron: "40 0 * * 1-5"
    # Strict pool scans: 09:16/09:26 Asia/Taipei.
    - cron: "16 1 * * 1-5"
    - cron: "26 1 * * 1-5"
    # Weekly expanded/fixed pool third scan: 09:31 Asia/Taipei.
    - cron: "31 1 * * 1-5"
    # Refresh next week's fixed pool Friday 17:30 Asia/Taipei (09:30 UTC).
    - cron: "30 9 * * 5"
    # Taiwan 19:00 target delivery window.
    # GitHub scheduled runs can be delayed or occasionally skipped, so use several
    # insurance slots around 19:00. The script uses --skip-if-sent to prevent
    # duplicate emails after the first successful delivery.
    # 18:45/18:55 Asia/Taipei = 10:45/10:55 UTC.
    - cron: "45,55 10 * * *"
    # 19:05-19:55 Asia/Taipei = 11:05-11:55 UTC.
    - cron: "5,15,25,35,45,55 11 * * *"
    # 20:10/20:30/20:50 Asia/Taipei = 12:10/12:30/12:50 UTC.
    - cron: "10,30,50 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build-a5n-pool
          - scan-a5n-pool
          - build-a5n-fixed-pool
          - scan-a5n-fixed-pool
  repository_dispatch:
    types: [daily_screener]

permissions:
  contents: write

concurrency:
  # A5-N early scans must not be queued behind or displaced by formal-report
  # insurance runs.  Each family remains serialized within its own group.
  group: ${{ ((github.event_name == 'repository_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && inputs.mode != '') || (github.event_name == 'schedule' && (github.event.schedule == '40 0 * * 1-5' || github.event.schedule == '16 1 * * 1-5' || github.event.schedule == '26 1 * * 1-5' || github.event.schedule == '31 1 * * 1-5' || github.event.schedule == '30 9 * * 5'))) && format('a5n-{0}', github.ref) || format('daily-tw-stock-screener-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  a5n-build-pool:
    if: (github.event_name == 'schedule' && github.event.schedule == '40 0 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'build-a5n-pool')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build A5-N T-1 candidate pool
        run: python tw_stock_screener.py --a5n-build-pool
      - name: Persist A5-N candidate pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledgers/a5n_daily_candidate_pool.json ledgers/a5n_premarket_ledger.jsonl ledgers/a5n_b_shadow_candidate_pool.json ledgers/a5n_b_shadow_premarket_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Build A5-N premarket candidate pool"
            git pull --rebase
            git push
          fi

  a5n-build-fixed-pool:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 9 * * 5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'build-a5n-fixed-pool')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build next-week A5-N fixed pool
        run: python tw_stock_screener.py --a5n-build-fixed-pool
      - name: Persist A5-N fixed pool and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledgers/a5n_weekly_fixed_pool.json ledgers/a5n_weekly_fixed_pool_ledger.jsonl ledgers/a5n_weekly_fixed_pool_momentum_rank_shadow.json ledgers/a5n_weekly_fixed_pool_momentum_rank_shadow_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Build weekly A5-N fixed pool"
            git pull --rebase
            git push
          fi

  intraday-ntfy:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '16 1 * * 1-5' || github.event.schedule == '26 1 * * 1-5' || github.event.schedule == '31 1 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'scan-a5n-pool' || inputs.mode == 'scan-a5n-fixed-pool'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      A5N_NOTIFICATION_SLOT: ${{ github.event_name == 'schedule' && github.event.schedule == '16 1 * * 1-5' && '09:16' || github.event_name == 'schedule' && github.event.schedule == '26 1 * * 1-5' && '09:26' || github.event_name == 'schedule' && github.event.schedule == '31 1 * * 1-5' && '09:31' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A5-N candidate-pool ntfy alert check
        if: (github.event_name == 'schedule' && (github.event.schedule == '16 1 * * 1-5' || github.event.schedule == '26 1 * * 1-5')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan-a5n-pool')
        run: python tw_stock_screener.py --a5n-scan-pool

      - name: Run A5-N fixed-pool third scan
        if: (github.event_name == 'schedule' && github.event.schedule == '31 1 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan-a5n-fixed-pool')
        run: python tw_stock_screener.py --a5n-scan-fixed-pool

      - name: Route repository dispatch to A5-N by Taiwan time
        if: github.event_name == 'repository_dispatch'
        run: |
          hour="$(TZ=Asia/Taipei date +%H)"
          minute="$(TZ=Asia/Taipei date +%M)"
          weekday="$(TZ=Asia/Taipei date +%u)"
          echo "Repository dispatch at Taiwan ${hour}:${minute}"
          if [ "${weekday}" -gt 5 ]; then
            echo "Weekend; skip A5-N build, scan and ntfy."
          elif [ "${hour}" = "08" ]; then
            python tw_stock_screener.py --a5n-build-pool
          elif [ "${hour}" = "09" ] && [ "${minute}" -le 35 ]; then
            if ! python tw_stock_screener.py --a5n-scan-pool; then
              echo "Strict pool missing/stale; rebuild then retry."
              python tw_stock_screener.py --a5n-build-pool
              python tw_stock_screener.py --a5n-scan-pool
            fi
          elif [ "${hour}" = "09" ]; then
            python tw_stock_screener.py --a5n-scan-fixed-pool
          else
            echo "Repository dispatch is outside A5-N 08:00-09:59 window; skip A5-N."
          fi

      - name: Persist raw signal ledgers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledgers/*.jsonl ledgers/a5n_daily_candidate_pool.json ledgers/a5n_b_shadow_candidate_pool.json ledgers/a5n_notification_slots.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update raw signal ledgers"
            git pull --rebase
            git push
          else
            echo "No raw signal ledger changes to persist."
          fi

      - name: Upload raw signal ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-intraday-raw-signal-ledgers
          path: ledgers/*.jsonl
          if-no-files-found: ignore

  run-screener:
    if: (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'auto' || inputs.mode == '')) || (github.event_name == 'schedule' && github.event.schedule != '40 0 * * 1-5' && github.event.schedule != '16 1 * * 1-5' && github.event.schedule != '26 1 * * 1-5' && github.event.schedule != '31 1 * * 1-5' && github.event.schedule != '30 9 * * 5')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.GMAIL_USER }}
      SMTP_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.GMAIL_USER }}
      EMAIL_TO: ${{ secrets.GMAIL_USER }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide Taiwan run mode
        id: delivery-window
        run: |
          hour="$(TZ=Asia/Taipei date +%H)"
          minute="$(TZ=Asia/Taipei date +%M)"
          echo "Taiwan hour: ${hour}"
          echo "Taiwan minute: ${minute}"
          if [ "${hour}" -ge 9 ] && [ "${hour}" -le 13 ]; then
            echo "run_mode=intraday" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${hour}" -ge 18 ] && [ "${hour}" -le 22 ]; then
            echo "run_mode=evening" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside Taiwan delivery windows; skip delayed scheduled run."
          echo "run_mode=skip" >> "$GITHUB_OUTPUT"

      - name: Run intraday ntfy alert check
        # repository_dispatch is handled by the dedicated A5-N job above.
        # Do not also emit the legacy combined A4/A5 market-skip message.
        if: steps.delivery-window.outputs.run_mode == 'intraday' && github.event_name != 'repository_dispatch'
        run: python tw_stock_screener.py --intraday-ntfy

      - name: Run screener and send email report
        if: steps.delivery-window.outputs.run_mode == 'evening'
        run: python tw_stock_screener.py --skip-if-sent

      - name: Persist screener journal
        if: always() && steps.delivery-window.outputs.run_mode == 'evening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_journal.csv reports/*.html sent_reports/*.txt ledgers/*.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update screener journal"
            git pull --rebase
            git push
          else
            echo "No screener journal changes to persist."
          fi

      - name: Upload latest report artifact
        if: always() && steps.delivery-window.outputs.run_mode == 'evening'
        uses: actions/upload-artifact@v4
        with:
          name: latest-screener-report
          path: |
            last_report.txt
            trade_journal.csv
            reports/*.html
            ledgers/*.jsonl
          if-no-files-found: ignore
