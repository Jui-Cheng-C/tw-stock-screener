name: Daily Taiwan Stock Screener

on:
  schedule:
    # Dedicated intraday ntfy checks for category 4/5.
    # 09:16/10:16 Asia/Taipei = 01:16/02:16 UTC.
    - cron: "16 1,2 * * 1-5"
    # Taiwan 19:00 target delivery window.
    # GitHub scheduled runs can be delayed or occasionally skipped, so use several
    # insurance slots around 19:00. The script uses --skip-if-sent to prevent
    # duplicate emails after the first successful delivery.
    # 18:45/18:55 Asia/Taipei = 10:45/10:55 UTC.
    - cron: "45,55 10 * * *"
    # 19:05-19:55 Asia/Taipei = 11:05-11:55 UTC.
    - cron: "5,15,25,35,45,55 11 * * *"
    # 20:10/20:30/20:50 Asia/Taipei = 12:10/12:30/12:50 UTC.
    - cron: "10,30,50 12 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily_screener]

permissions:
  contents: write

concurrency:
  group: daily-tw-stock-screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intraday-ntfy:
    if: github.event_name == 'schedule' && github.event.schedule == '16 1,2 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run category 4/5 ntfy alert check
        run: python tw_stock_screener.py --intraday-ntfy

  run-screener:
    if: github.event_name != 'schedule' || github.event.schedule != '16 1,2 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.GMAIL_USER }}
      SMTP_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.GMAIL_USER }}
      EMAIL_TO: ${{ secrets.GMAIL_USER }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide Taiwan run mode
        id: delivery-window
        run: |
          hour="$(TZ=Asia/Taipei date +%H)"
          minute="$(TZ=Asia/Taipei date +%M)"
          echo "Taiwan hour: ${hour}"
          echo "Taiwan minute: ${minute}"
          if [ "${hour}" -ge 9 ] && [ "${hour}" -le 13 ]; then
            echo "run_mode=intraday" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${hour}" -ge 18 ] && [ "${hour}" -le 22 ]; then
            echo "run_mode=evening" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Outside Taiwan delivery windows; skip delayed scheduled run."
          echo "run_mode=skip" >> "$GITHUB_OUTPUT"

      - name: Run intraday ntfy alert check
        if: steps.delivery-window.outputs.run_mode == 'intraday'
        run: python tw_stock_screener.py --intraday-ntfy

      - name: Run screener and send email report
        if: steps.delivery-window.outputs.run_mode == 'evening'
        run: python tw_stock_screener.py --skip-if-sent

      - name: Persist screener journal
        if: always() && steps.delivery-window.outputs.run_mode == 'evening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_journal.csv reports/*.html sent_reports/*.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update screener journal"
            git pull --rebase
            git push
          else
            echo "No screener journal changes to persist."
          fi

      - name: Upload latest report artifact
        if: always() && steps.delivery-window.outputs.run_mode == 'evening'
        uses: actions/upload-artifact@v4
        with:
          name: latest-screener-report
          path: |
            last_report.txt
            trade_journal.csv
            reports/*.html
          if-no-files-found: ignore
